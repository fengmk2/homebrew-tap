name: Update Projj Desktop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-projj
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'fengmk2/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Read the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-projj.mjs
      - name: Publish the cask update
        if: steps.release.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/projj-desktop.rb
          git commit -m 'chore: update Projj Desktop'
          git push origin HEAD:main
