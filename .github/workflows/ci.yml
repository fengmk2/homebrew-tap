name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs

  cask:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ASK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Load the checkout as a tap
        run: brew tap fengmk2/tap "$GITHUB_WORKSPACE"
      - name: Install the app and CLI
        run: brew install --cask fengmk2/tap/projj-desktop
      - name: Check cask style
        run: brew style --cask fengmk2/tap/projj-desktop
      - name: Verify the installation
        run: |
          brew audit --cask fengmk2/tap/projj-desktop
          test -d /Applications/Projj.app
          codesign --verify --deep --strict /Applications/Projj.app
          "$(brew --prefix)/bin/projj" --version
      - name: Uninstall
        run: brew uninstall --cask fengmk2/tap/projj-desktop
